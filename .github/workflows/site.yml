# Runs on every push and pull request: builds the site and runs the pre-publish check
# (missing links, leftover placeholders). Cloudflare runs the same check inside its own build,
# so a failure here also means the deploy would have been refused.
name: Site check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
